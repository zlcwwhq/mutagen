# Set the workflow name.
name: CI

# Execute the workflow on version tag pushes, pull requests, and manual
# dispatch. Pushes to branches don't run it: most changes run nothing but
# commit verification (see the tier job), and a release's commit runs the
# full matrix before it's tagged. Pull requests also run when they're
# labeled, so that adding the full-ci label starts the full matrix. Pull
# requests that only touch documentation or the skill submodule don't run
# it, since no job reads either.
on:
  push:
    tags:
      - 'v*-zlcwwhq.*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'skills/**'
  workflow_dispatch:

# Restrict default token permissions. Jobs that need write access
# (e.g., release) escalate explicitly.
permissions:
  contents: read

# Cancel in-progress runs for the same ref, except for tag builds
# (which should always run to completion for releases). Adding any label
# other than full-ci starts a run that does nothing, so it gets a group of
# its own and can't cancel the pull request's real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Define the workflow jobs.
jobs:
  # Decide how much of the workflow runs:
  # - full: the full matrix, for tags, manual dispatches, and pull requests
  #   with the full-ci label.
  # - fast: Linux on the newest Go version, for other pull requests that
  #   change more than FAST_CI_LINES lines.
  # - none: nothing but commit verification, for the remaining pull
  #   requests.
  # Pull request events carry the labels and the size of the change, so
  # this needs no checkout. The other jobs need this one, so a run started
  # by any other label skips them all.
  tier:
    name: CI Tier
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    timeout-minutes: 5
    env:
      FAST_CI_LINES: 1000
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - id: tier
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
              tier="full"
          elif jq -e '.pull_request.labels | any(.name == "full-ci")' "${GITHUB_EVENT_PATH}" > /dev/null; then
              tier="full"
          elif [[ "$(jq '.pull_request.additions + .pull_request.deletions' "${GITHUB_EVENT_PATH}")" -gt "${FAST_CI_LINES}" ]]; then
              tier="fast"
          else
              tier="none"
          fi
          echo "tier=${tier}" >> "${GITHUB_OUTPUT}"
          echo "CI tier: ${tier}" >> "${GITHUB_STEP_SUMMARY}"
  # Validate the release version. The platform jobs need this job, so it
  # also passes the tier on to them.
  version:
    name: Release Version Validation
    needs: tier
    if: needs.tier.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ needs.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.2'
      - run: go test ./scripts/ci/releaseversion
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: go run ./scripts/ci/releaseversion -tag "$GITHUB_REF_NAME"
  verification:
    name: Commit Verification
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: "Perform commit verification"
        run: |
          # Determine the target commit range.
          export VERIFY_COMMIT_START="${{ github.event.pull_request.base.sha }}"
          export VERIFY_COMMIT_END="${{ github.event.pull_request.head.sha }}"

          # Perform verification.
          scripts/ci/verify_commits.sh
  macos:
    needs: version
    if: needs.version.outputs.tier == 'full'
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.2'
      - name: "Install sha256sum"
        run: brew install coreutils
      - name: Set release version
        if: github.ref_type == 'tag'
        shell: bash
        run: go run ./scripts/ci/releaseversion -tag "$GITHUB_REF_NAME" -write
      - run: scripts/ci/setup_go.sh
      - run: scripts/ci/setup_ssh.sh
      - run: scripts/ci/setup_partitions_darwin.sh
      - run: scripts/ci/analyze.sh
      - run: scripts/ci/test.sh
      - run: scripts/ci/build.sh
      - run: scripts/ci/sha256sum.sh
        if: github.ref_type == 'tag'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: bundles
          path: build/release/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  linux:
    needs: version
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goversion: ${{ fromJSON(needs.version.outputs.tier == 'full' && '["1.25.9", "1.26.2"]' || '["1.26.2"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.goversion }}
      - name: Set release version
        if: github.ref_type == 'tag'
        shell: bash
        run: go run ./scripts/ci/releaseversion -tag "$GITHUB_REF_NAME" -write
      - run: scripts/ci/setup_go.sh
      - run: scripts/ci/setup_ssh.sh
      - run: scripts/ci/setup_docker.sh
      - run: scripts/ci/analyze.sh
      - run: scripts/ci/test.sh
      - run: scripts/ci/test_386.sh
        if: needs.version.outputs.tier == 'full'
      - run: scripts/ci/build.sh
  windows:
    needs: version
    if: needs.version.outputs.tier == 'full'
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.2'
      - name: Set release version
        if: github.ref_type == 'tag'
        shell: bash
        run: go run ./scripts/ci/releaseversion -tag "$GITHUB_REF_NAME" -write
      - run: scripts/ci/setup_go.sh
        shell: bash
      - run: scripts/ci/setup_docker.sh
        shell: bash
      - name: "Prepare Windows partition script"
        run: |
          # Populate the partition setup script with the repository path since
          # diskpart doesn't support relative paths or environment variable
          # substitution. While we could hardcode a path into the script, that
          # breaks CI for mirrors that have a different repository name.
          REPONAME="$(basename "$(pwd)")"
          sed -e "s/REPONAME/D:\\\\a\\\\${REPONAME}\\\\${REPONAME}/g" \
            scripts/ci/setup_partitions_windows_template.txt \
            > setup_partitions_windows.txt
        shell: bash
      - run: diskpart /s setup_partitions_windows.txt
      - run: scripts/ci/analyze.sh
        shell: bash
      - run: scripts/ci/test.sh
        shell: bash
      - run: scripts/ci/test_386.sh
        shell: bash
      - run: scripts/ci/build.sh
        shell: bash
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [macos, linux, windows]
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: bundles
      - name: Create draft release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Verify archive integrity before uploading. A draft keeps partially
          # uploaded assets out of published releases if the upload fails.
          (cd bundles && sha256sum --check SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Refusing to replace assets on a published release" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" bundles/* --clobber
