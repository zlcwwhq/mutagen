syntax = "proto3";

package synchronization;

option go_package = "github.com/mutagen-io/mutagen/pkg/synchronization";

// Version specifies a session version, providing default behavior that can vary
// without affecting existing sessions.
enum Version {
    // Invalid is the default session version and represents an unspecfied and
    // invalid version. It is used as a sanity check to ensure that version is
    // set for a session.
    Invalid = 0;
    // Version1 represents session version 1.
    Version1 = 1;
    // Version2 represents session version 2, which is the version of sessions
    // in Git mode. Its defaults are those of session version 1, but daemons
    // that don't support Git mode don't support it either, so they don't load
    // such sessions, which they would otherwise synchronize as ordinary ones,
    // including their repositories' Git directories.
    Version2 = 2;
    // Version3 represents session version 3, which is the version of sessions
    // whose remote submission mode keeps an endpoint from submitting commands
    // that it would submit by default, whether in Git mode or not. Its
    // defaults are those of session version 1, but daemons that don't support
    // remote submission modes don't support it either, so they don't load
    // such sessions, which would otherwise let that endpoint submit commands.
    Version3 = 3;
}
