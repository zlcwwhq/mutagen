syntax = "proto3";

package core;

option go_package = "github.com/mutagen-io/mutagen/pkg/synchronization/core";

import "synchronization/core/entry.proto";
import "synchronization/core/problem.proto";

// Snapshot bundles a filesystem content snapshot with associated metadata.
// Snapshot objects should be considered immutable and must not be modified.
message Snapshot {
    // Content is the filesystem content at the snapshot root. It may be nil to
    // indicate an absence of content.
    Entry content = 1;
    // PreservesExecutability indicates whether or not the associated filesystem
    // preserves POSIX executability bits.
    bool preservesExecutability = 2;
    // DecomposesUnicode indicates whether or not the associated filesystem
    // decomposes Unicode names.
    bool decomposesUnicode = 3;
    // Directories is the number of synchronizable directory entries contained
    // in the snapshot.
    uint64 directories = 4;
    // Files is the number of synchronizable file entries contained in the
    // snapshot.
    uint64 files = 5;
    // SymbolicLinks is the number of synchronizable symbolic link entries
    // contained in the snapshot.
    uint64 symbolicLinks = 6;
    // TotalFileSize is the total size of all synchronizable files referenced by
    // the snapshot.
    uint64 totalFileSize = 7;
    // Warnings are problems with the endpoint's content that the scan itself
    // doesn't represent, such as content that a Git repository tracks but that
    // isn't synchronized. They're informational: they don't affect
    // synchronization, and they aren't part of the snapshot's identity, so they
    // don't participate in snapshot equality.
    repeated Problem warnings = 8;
    // Seeds maps the paths of submodules that this endpoint populated with a
    // clone, and whose populations the ancestor hasn't yet absorbed, to the
    // content of the clone (the synchronizable content that the population
    // yielded, including the Git entry, whose seed identifies the record that
    // the endpoint keeps of it). A population yields a transition result like
    // any other, but if the session stops before saving the ancestor, then
    // that content is lost, along with the knowledge that the submodule's
    // content came from a clone rather than from changes on this endpoint.
    // The session uses it in place of the ancestor at those paths. Like
    // warnings, seeds aren't part of the snapshot's identity.
    map<string, Entry> seeds = 9;
    // SubmoduleStatuses maps the paths of submodules that have a commit
    // checked out other than the one that the ancestor has for them (or for
    // which the ancestor doesn't have one) to how their working trees differ
    // from that commit, as far as Git could tell. Reconciliation uses them
    // when both endpoints have the same commit checked out, to identify the
    // content that one endpoint has changed and the other hasn't. Like
    // warnings, they aren't part of the snapshot's identity.
    map<string, SubmoduleStatus> submoduleStatuses = 10;
}

// SubmoduleStatus describes how the working tree of a submodule differs from
// the commit that it has checked out, according to Git (after its filters and
// line ending conversions).
message SubmoduleStatus {
    // Commit is the commit that the submodule had checked out, which is the
    // digest of its GitLink entry in the snapshot.
    bytes commit = 1;
    // Changed are the paths, relative to the submodule, of the files and
    // symbolic links in the snapshot's content for the submodule (excluding
    // the content of submodules nested in it) whose content Git doesn't
    // consider to be the commit's: those that are modified, staged, or not
    // tracked, along with those for which Git doesn't compare the content
    // (because they're marked as assumed to be unchanged or as outside of a
    // sparse checkout). Every other file and symbolic link in the snapshot's
    // content for the submodule is the commit's.
    repeated string changed = 2;
}
